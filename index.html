<style>

    --green: #00b894;
    --red: #ff7675;

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

    background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px;
    background-image: radial-gradient(circle at 15% 50%, rgba(108, 92, 231, 0.15), transparent 25%),
                      radial-gradient(circle at 85% 30%, rgba(0, 184, 148, 0.1), transparent 25%);
    padding-bottom: 80px;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeUp 0.4s ease-out forwards; opacity: 0; }
  .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .controls { display: flex; gap: 10px; }
  .icon-btn { padding: 8px 12px; border-radius: 8px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; }
  .icon-btn:active { transform: scale(0.95); background: var(--accent); }
  .dashboard { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 800px; margin: 0 auto; }
  .card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px; transition: 0.2s; position: relative; overflow: hidden; }
  .card.clickable { cursor: pointer; }
  .card.clickable:active { transform: scale(0.98); border-color: rgba(108, 92, 231, 0.6); }
  .card-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .card-value { font-size: 28px; font-weight: 700; }
  .value-green { color: var(--green); } .value-red { color: var(--red); }
  .chart-container { height: 250px; margin-top: 10px; width: 100%; }
  .transactions-list { max-height: 400px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
  .tx-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.1); border-radius: 8px; margin-bottom: 8px; animation: fadeUp 0.3s ease-out forwards; opacity: 0; }
  .tx-info { display: flex; flex-direction: column; flex: 1; }
  .tx-desc { font-weight: 600; font-size: 15px; }
  .tx-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .tx-right { display: flex; align-items: center; gap: 10px; }
  .tx-amount { font-weight: bold; font-size: 15px; text-align: right; }
  .tx-income { color: var(--green); } .tx-expense { color: var(--red); }
  .del-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 5px; display: flex; align-items: center; }
  .del-btn:active { color: var(--red); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; backdrop-filter: blur(5px); }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: #1a1a24; padding: 25px; border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; transform: translateY(100%); transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal h2 { margin-bottom: 15px; color: var(--accent); font-size: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; font-size: 16px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .btn { padding: 12px 20px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%; }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn-outline { background: transparent; border: 2px solid var(--accent); }
  .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 30px; background: var(--accent); color: white; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 4px 15px var(--accent-glow); border: none; z-index: 50; transition: 0.2s; }
  .fab:active { transform: scale(0.9); }
  .detail-layout { display: flex; flex-direction: column; gap: 20px; }
  .detail-chart-wrap { position: relative; height: 200px; width: 100%; display: flex; justify-content: center; }
  .detail-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
  .detail-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
  .detail-item .name { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .detail-item .amount { font-weight: bold; font-size: 14px; }
  .detail-item .percent { color: var(--text-muted); font-size: 11px; margin-left: 5px; }
</style>

<body>

<div class="header">
  <h1>Мои Финансы</h1>
  <div class="controls">
    <button class="icon-btn" onclick="exportData()" title="Экспорт (бэкап)">📤</button>
    <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Импорт из файла">📥</button>
    <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="importFromFile(event)">
  </div>
</div>

<div class="dashboard">
  <div class="card clickable animate-in delay-1" onclick="showDetails('assets')">
    <div class="card-title">Общие активы</div>
    <div class="card-value value-green" id="totalAssets">0 ₽</div>
  </div>
  <div class="card clickable animate-in delay-2" onclick="showDetails('liabilities')">
    <div class="card-title">Общие пассивы и долги</div>
    <div class="card-value value-red" id="totalLiabilities">0 ₽</div>
  </div>
  <div class="card clickable animate-in delay-3" onclick="showDetails('networth')">
    <div class="card-title">Чистый капитал</div>
    <div class="card-value" id="netWorth">0 ₽</div>
  </div>

  <div class="card animate-in delay-3">
    <div class="card-title">Расходы по месяцам</div>
    <div class="chart-container"><canvas id="expenseChart"></canvas></div>
  </div>

  <div class="card animate-in delay-3">
    <div class="card-title">Транзакции</div>
    <div class="transactions-list" id="txList"></div>
  </div>
</div>

<button class="fab" onclick="openModal('addTxModal')">+</button>

<div class="modal-overlay" id="addTxModal">
  <div class="modal">
    <h2>Новая транзакция</h2>
    <div class="form-group"><label>Дата</label><input type="date" id="txDate" required></div>
    <div class="form-group"><label>Тип</label><select id="txType"><option value="expense">Расход</option><option value="income">Доход</option></select></div>
    <div class="form-group"><label>Категория</label><input type="text" id="txCategory" placeholder="Продукты, Транспорт..." required></div>
    <div class="form-group"><label>Описание (необязательно)</label><input type="text" id="txDesc" placeholder="Пятерочка, Такси..."></div>
    <div class="form-group"><label>Сумма (₽)</label><input type="number" id="txAmount" placeholder="1000" required inputmode="decimal"></div>
    <button class="btn" onclick="addTransaction()">Добавить</button>
    <button class="btn btn-outline" style="margin-top: 10px;" onclick="closeModal('addTxModal')">Отмена</button>
  </div>
</div>

<div class="modal-overlay" id="detailsModal">
  <div class="modal">
    <h2 id="detailTitle">Детализация</h2>
    <div class="detail-layout">
      <div class="detail-chart-wrap"><canvas id="detailChart"></canvas></div>
      <div class="detail-list" id="detailList"></div>
    </div>
    <div id="addAssetForm" style="display: none; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
      <div class="form-group"><label>Название</label><input type="text" id="assetName" placeholder="Наличные, Тинькофф..."></div>
      <div class="form-group"><label>Сумма (₽)</label><input type="number" id="assetAmount" placeholder="10000" inputmode="decimal"></div>
      <button class="btn" onclick="addAssetOrLiability()">Добавить</button>
    </div>
    <button class="btn btn-outline" style="margin-top: 15px;" onclick="closeModal('detailsModal')">Закрыть</button>
  </div>
</div>

  let appData = JSON.parse(localStorage.getItem('financeData')) || defaultData;
  
  // Записываем их в память, чтобы приложение работало с ними
  if(!localStorage.getItem('financeData')) {
    localStorage.setItem('financeData', JSON.stringify(defaultData));
  }

  const CHART_COLORS = ['#6c5ce7', '#00b894', '#ff7675', '#fdcb6e', '#74b9ff', '#a29bfe', '#55efc4', '#fab1a0'];

  function formatMoney(amount) { return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(amount); }
  function saveData() { localStorage.setItem('financeData', JSON.stringify(appData)); }

  function renderDashboard() {
    const assetsSum = appData.assets.reduce((sum, item) => sum + Number(item.amount), 0);
    const liabSum = appData.liabilities.reduce((sum, item) => sum + Number(item.amount), 0);
    const netWorth = assetsSum - liabSum;
    document.getElementById('totalAssets').textContent = formatMoney(assetsSum);
    document.getElementById('totalLiabilities').textContent = formatMoney(liabSum);
    document.getElementById('netWorth').textContent = formatMoney(netWorth);
    document.getElementById('netWorth').className = `card-value ${netWorth >= 0 ? 'value-green' : 'value-red'}`;
    renderTransactions();
    renderMainChart();
  }

  function renderTransactions() {
    const txList = document.getElementById('txList');
    txList.innerHTML = '';
    const sortedTx = [...appData.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
    if (sortedTx.length === 0) { txList.innerHTML = '<p style="text-align:center; color:gray; padding: 20px;">Нет транзакций.</p>'; return; }
    sortedTx.forEach((tx, index) => {
      const el = document.createElement('div');
      el.className = 'tx-item';
      el.style.animationDelay = `${index * 0.05}s`;
      const isIncome = tx.type === 'income';
      const sign = isIncome ? '+' : '-';
      const colorClass = isIncome ? 'tx-income' : 'tx-expense';
      const dateObj = new Date(tx.date);
      const dateStr = isNaN(dateObj) ? tx.date : dateObj.toLocaleDateString('ru-RU');
      const originalIndex = appData.transactions.indexOf(tx);
      el.innerHTML = `
        <div class="tx-info">
          <span class="tx-desc">${tx.description || tx.category}</span>
          <span class="tx-date">${dateStr} · ${tx.category}</span>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${colorClass}">${sign}${formatMoney(tx.amount)}</div>
          <button class="del-btn" onclick="deleteTransaction(${originalIndex})">🗑️</button>
        </div>
      `;
      txList.appendChild(el);
    });
  }

  function renderMainChart() {
    const ctx = document.getElementById('expenseChart').getContext('2d');
    const monthlyExpenses = {};
    appData.transactions.forEach(tx => {
      if (tx.type === 'expense') {
        const monthKey = tx.date.substring(0, 7); 
        monthlyExpenses[monthKey] = (monthlyExpenses[monthKey] || 0) + Number(tx.amount);
      }
    });
    const sortedMonths = Object.keys(monthlyExpenses).sort();
    const monthNames = { '01': 'Янв', '02': 'Фев', '03': 'Мар', '04': 'Апр', '05': 'Май', '06': 'Июн', '07': 'Июл', '08': 'Авг', '09': 'Сен', '10': 'Окт', '11': 'Ноя', '12': 'Дек' };
    const labels = sortedMonths.map(m => { const [year, month] = m.split('-'); return `${monthNames[month] || month} ${year.substring(2)}`; });
    const data = sortedMonths.map(m => monthlyExpenses[m]);
    if (mainChartInstance) mainChartInstance.destroy();
    mainChartInstance = new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label: 'Расходы (₽)', data: data, backgroundColor: 'rgba(108, 92, 231, 0.7)', borderColor: '#6c5ce7', borderWidth: 2, borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 1000 }, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8a8a9a' } }, x: { grid: { display: false }, ticks: { color: '#e0e0e0', font: { weight: 'bold' } } } } }
    });
  }

  function addTransaction() {
    const date = document.getElementById('txDate').value;
    const type = document.getElementById('txType').value;
    const category = document.getElementById('txCategory').value;
    const desc = document.getElementById('txDesc').value;
    const amount = parseFloat(document.getElementById('txAmount').value);
    if (!date || !category || isNaN(amount) || amount <= 0) { alert('Заполните все поля!'); return; }
    appData.transactions.push({ date, type, category, description: desc || category, amount });
    saveData(); renderDashboard(); closeModal('addTxModal');
    document.getElementById('txCategory').value = ''; document.getElementById('txDesc').value = ''; document.getElementById('txAmount').value = '';
  }

  function deleteTransaction(index) {
    if (confirm('Удалить эту транзакцию?')) {
      appData.transactions.splice(index, 1);
      saveData(); renderDashboard();
      if (currentDetailType === 'networth') showDetails('networth');
    }
  }

  function showDetails(type) {
    currentDetailType = type;
    const modal = document.getElementById('detailsModal');
    const title = document.getElementById('detailTitle');
    const listContainer = document.getElementById('detailList');
    const ctx = document.getElementById('detailChart').getContext('2d');
    const addForm = document.getElementById('addAssetForm');
    let items = []; let total = 0; let canAdd = false;
    if (type === 'assets') { title.textContent = 'Активы'; items = appData.assets; total = items.reduce((s, i) => s + Number(i.amount), 0); canAdd = true; }
    else if (type === 'liabilities') { title.textContent = 'Пассивы'; items = appData.liabilities; total = items.reduce((s, i) => s + Number(i.amount), 0); canAdd = true; }
    else if (type === 'networth') {
      title.textContent = 'Чистый капитал';
      const aSum = appData.assets.reduce((s, i) => s + Number(i.amount), 0);
      const lSum = appData.liabilities.reduce((s, i) => s + Number(i.amount), 0);
      items = [{ name: 'Активы (+)', amount: aSum, color: CHART_COLORS[1] }, { name: 'Долги (-)', amount: lSum, color: CHART_COLORS[2] }];
      total = aSum + lSum; canAdd = false;
    }
    addForm.style.display = canAdd ? 'block' : 'none';
    if (items.length === 0) { listContainer.innerHTML = '<p style="text-align:center; color:gray;">Нет данных</p>'; if (detailChartInstance) detailChartInstance.destroy(); modal.classList.add('active'); return; }
    const sortedItems = [...items].sort((a, b) => b.amount - a.amount);
    listContainer.innerHTML = '';
    sortedItems.forEach((item, index) => {
      const percent = total > 0 ? ((item.amount / total) * 100).toFixed(1) : 0;
      const color = item.color || CHART_COLORS[index % CHART_COLORS.length];
      const el = document.createElement('div'); el.className = 'detail-item';
      let delBtnHtml = '';
      if (type === 'assets' || type === 'liabilities') {
        const originalIndex = items.indexOf(item);
        delBtnHtml = `<button class="del-btn" onclick="deleteAssetOrLiability('${type}', ${originalIndex}); showDetails('${type}');">🗑️</button>`;
      }
      el.innerHTML = `<div class="name"><span class="color-dot" style="background:${color}"></span>${item.name}</div><div style="display:flex; align-items:center; gap:5px;"><span class="amount">${formatMoney(item.amount)}</span><span class="percent">${percent}%</span>${delBtnHtml}</div>`;
      listContainer.appendChild(el);
    });
    if (detailChartInstance) detailChartInstance.destroy();
    detailChartInstance = new Chart(ctx, {
      type: type === 'networth' ? 'doughnut' : 'pie',
      data: { labels: sortedItems.map(i => i.name), datasets: [{ data: sortedItems.map(i => i.amount), backgroundColor: sortedItems.map((i, idx) => i.color || CHART_COLORS[idx % CHART_COLORS.length]), borderWidth: 0, hoverOffset: 5 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { animateScale: true, animateRotate: true, duration: 800 }, plugins: { legend: { display: false } }, cutout: type === 'networth' ? '70%' : 0 }
    });
    modal.classList.add('active');
  }

  function addAssetOrLiability() {
    const name = document.getElementById('assetName').value;
    const amount = parseFloat(document.getElementById('assetAmount').value);
    if (!name || isNaN(amount)) { alert('Введите название и сумму'); return; }
    if (currentDetailType === 'assets') appData.assets.push({ name, amount });
    else if (currentDetailType === 'liabilities') appData.liabilities.push({ name, amount });
    saveData(); renderDashboard(); showDetails(currentDetailType);
    document.getElementById('assetName').value = ''; document.getElementById('assetAmount').value = '';
  }

  function deleteAssetOrLiability(type, index) {
    if (!confirm('Удалить эту запись?')) return;
    if (type === 'assets') appData.assets.splice(index, 1); else appData.liabilities.splice(index, 1);
    saveData(); renderDashboard();
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `finance_backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
  }

  function importFromFile(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.assets || !parsed.transactions) { alert('Ошибка: неверный формат файла'); return; }
        appData = parsed; saveData(); renderDashboard(); alert('✅ Данные загружены!');
      } catch (err) { alert('❌ Ошибка чтения файла'); }
    };
    reader.readAsText(file); event.target.value = '';
  }

  function openModal(id) {
    if (id === 'addTxModal') document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
    document.getElementById(id).classList.add('active');
  }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });
  });
  renderDashboard();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"="black-translucent">
  <title>Мои Финансы</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js остается, так как нужен для графиков -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Убран welcome-overlay, логика первого запуска теперь в JS -->
  
  <div class="header">
    <h1>Мои Финансы</h1>
    <div class="controls">
      <button class="icon-btn" id="themeBtn">🌙</button>
      <button class="icon-btn" id="exportBtn" title="Экспорт">📤</button>
      <button class="icon-btn" id="importBtn" title="Импорт">📥</button>
      <input type="file" id="fileInput" style="display:none;" accept=".json" onchange="importFromFile(event)">
    </div>
  </div>

  <div class="dashboard" id="dashboardWrap">
    <!-- Иконки заменены на текст для лучшей читаемости на iOS -->
    <div class="card" id="insightsCard">
      <div class="card-title">💡 Анализ</div>
      <div id="insightsText" class="muted">Загрузка...</div>
    </div>

    <div class="card clickable" id="assetsCard" onclick="showDetails('assets')">
      <div class="card-title">Активы</div>
      <div class="card-value green" id="totalAssets">0 ₽</div>
    </div>
    <div class="card clickable" id="liabilitiesCard" onclick="showDetails('liabilities')">
      <div class="card-title">Пассивы</div>
      <div class="card-value red" id="totalLiabilities">0 ₽</div>
    </div>
    <div class="card clickable" id="networthCard" onclick="showDetails('networth')">
      <div class="card-title">Чистый капитал</div>
      <div class="card-value" id="netWorth">0 ₽</div>
    </div>

    <div class="card">
      <div class="card-title">Расходы по месяцам</div>
      <div class="chart-container"><canvas id="expenseChart"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">Аналитика по категориям</div>
      <div class="chart-container"><canvas id="categoryChart"></canvas></div>
    </div>

    <div class="card tx-card">
      <div class="card-title" style="justify-content: space-between;">
        <span>Транзакции <span id="txCount"></span></span>
        <button class="fab" id="fabBtn" onclick="openModal('addTxModal')">+</button>
      </div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск...">
      </div>
      <div class="tx-list" id="txList">
        <!-- Сюда рендерится список (виртуализация заменена на дебанс, см. JS) -->
      </div>
    </div>
  </div>

  <!-- МОДАЛКИ -->
  <div class="modal-overlay" id="addTxModal">
    <div class="modal">
      <h2>Новая транзакция</h2>
      <div class="form-group"><label>Дата</label><input type="date" id="txDate"></div>
      <div class="form-group">
        <label>Тип</label>
        <select id="txType" onchange="handleTypeChange()">
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select>
      </div>
      <div class="form-group">
        <label>Счет</label>
        <select id="txSource" onchange="handleSourceChange()"></select>
      </div>
      <div class="form-group" id="actionGroup" style="display:none;">
        <label>Действие</label>
        <select id="txAction">
          <option value="increase">Увеличить долг</option>
          <option value="decrease">Уменьшить долг</option>
        </select>
      </div>
      <div class="form-group"><label>Категория</label><select id="txCategory"></select></div>
      <div class="form-group"><label>Описание</label><input type="text" id="txDesc"></div>
      <div class="form-group"><label>Сумма (₽)</label><input type="number" id="txAmount" step="0.01"></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn" style="flex: 1;" onclick="addTransaction()">Добавить</button>
        <button class="btn btn-outline" style="flex: 1;" onclick="closeModal('addTxModal')">Отмена</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="detailsModal">
    <div class="modal">
      <h2 id="detailTitle">Детализация</h2>
      <div class="detail-layout">
        <div class="detail-chart"><canvas id="detailChart"></canvas></div>
        <div class="detail-list" id="detailList"></div>
      </div>
      <div id="addAssetForm" style="display:none; margin-top:15px; border-top:1px solid var(--border); padding-top:15px;">
        <div class="form-group"><label>Название</label><input type="text" id="assetName"></div>
        <div class="form-group"><label>Сумма (₽)</label><input type="number" id="assetAmount" step="0.01"></div>
        <button class="btn" onclick="addAssetOrLiability()">Добавить</button>
      </div>
      <button class="btn btn-outline" style="margin-top:15px; width: 100%;" onclick="closeModal('detailsModal')">Закрыть</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
